<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Assessment | Oakridge Partners</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Oakridge Partners</a>
        </div>
    </header>

    <main class="container page-content">
        <div class="quiz-container">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="step-indicator" class="step-indicator">Step 1</p>

            <form id="questionnaire-form">
                <div id="question-card" class="question-card">
                    <!-- Loaded dynamically via JS -->
                </div>

                <div class="form-navigation">
                    <button type="button" id="prev-btn" class="btn btn-secondary" style="display:none;">Previous</button>
                    <button type="button" id="next-btn" class="btn btn-primary">Next</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/questionnaire.js"></script>
</body>
</html>
